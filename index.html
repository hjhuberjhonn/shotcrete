<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shotcrete GMI GMI</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#e67e22">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
<h1>⛏️ Shotcrete GMI GMI</h1>
<p>Calculadora de sostenimiento minero</p>

<label>Ancho del túnel (m)</label>
<input id="ancho" type="number" step="0.01">

<label>Altura total del túnel (m)</label>
<input id="altura" type="number" step="0.01">

<label>Avance del disparo (m)</label>
<input id="avance" type="number" step="0.01">

<label>Espesor shotcrete (pulgadas)</label>
<input id="espesor" type="number" step="0.5" value="2">

<button onclick="calcular()">CALCULAR</button>
<button onclick="limpiar()">NUEVO</button>

<div id="resultado"></div>
</div>
<script src="app.js"></script>
<script>
if("serviceWorker" in navigator){
navigator.serviceWorker.register("service-worker.js");
}
</script>
</body>
</html>
